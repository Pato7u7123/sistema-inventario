name: CI - Integracion Continua y Pruebas Unitarias

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Ejecucion de Pruebas con unittest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar sintaxis de archivos
        run: |
          python -m py_compile src/producto.py

      - name: Ejecutar Suite de Pruebas Unitarias
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests
