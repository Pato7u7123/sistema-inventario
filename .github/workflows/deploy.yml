
name: Despliegue del Sistema de Inventario

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto liberado
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: v1.0.2
          fileName: sistema-inventario-v1.0.2.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar directorio
        run: |
          mkdir -p despliegue
          unzip sistema-inventario-v1.0.2.zip -d despliegue

      - name: Verificar archivos
        run: |
          ls -R despliegue
