
name: Despliegue del Sistema de Inventario

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Descargar artefacto liberado
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: v1.0.2
          fileName: sistema-inventario-v1.0.2.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar directorio
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "C:\despliegue-inventario\version-v1.0.2" -Force

      - name: Extraer archivos
        shell: powershell
        run: |
          Expand-Archive -Path "sistema-inventario-v1.0.2.zip" -DestinationPath "C:\despliegue-inventario\version-v1.0.2" -Force

      - name: Verificar archivos
        shell: powershell
        run: |
          Get-ChildItem -Path "C:\despliegue-inventario\version-v1.0.2" -Recurse
